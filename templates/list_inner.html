            <script>
    (function(){
      function collectDeleteMarks(){
        try{
          const marks = new Set();
          try{
            if(window && typeof window._fbp_collect_marks_from_tabulator === 'function'){
              const selected = window._fbp_collect_marks_from_tabulator() || [];
              if(Array.isArray(selected)) selected.forEach(v=>{ if(v) marks.add(String(v).trim()); });
            }
          }catch(_){ }

          Array.from(document.querySelectorAll('input[name="delete_mark"]:checked')).forEach(cb=>{
            try{
              const v = (cb.value||'').toString().trim();
              if(v && v.toLowerCase() !== 'on') { marks.add(v); return; }
              if(cb.dataset && cb.dataset.mark){ marks.add(String(cb.dataset.mark).trim()); return; }
              const tr = cb.closest && cb.closest('tr');
              if(tr && typeof window.parseRowToData === 'function'){
                const thead = document.querySelector('.summary-table thead');
                const colCount = thead ? thead.querySelectorAll('th').length || 0 : 0;
                const markColIndex = thead && typeof window.findMarkCol === 'function' ? window.findMarkCol(thead) : -1;
                const data = window.parseRowToData(tr, colCount, markColIndex);
                if(data && data._mark) marks.add(String(data._mark).trim());
              }
            }catch(_){ }
          });

          return Array.from(marks).filter(Boolean);
        }catch(_){
          return [];
        }
      }

      function closeDeleteModal(){
        const modal = document.getElementById('deleteModal');
        if(!modal) return;
        modal.style.display = 'none';
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }

      function openDeleteModal(count){
        const modal = document.getElementById('deleteModal');
        const modalMsg = document.getElementById('deleteModalMessage');
        if(modalMsg) modalMsg.textContent = `Θες σίγουρα να διαγράψεις ${count} εγγραφή(ες);`;
        if(!modal) return;
        modal.style.display = 'flex';
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      }

      function showDeleteSelectionAlert(){
        try{
          if(window.__fbpDeleteAlertOpen) return;
          window.__fbpDeleteAlertOpen = true;
          if(typeof showModalAlert === 'function'){
            const maybePromise = showModalAlert('Ενημέρωση', 'Επίλεξε πρώτα γραμμές για διαγραφή.');
            if(maybePromise && typeof maybePromise.finally === 'function'){
              maybePromise.finally(()=>{ window.__fbpDeleteAlertOpen = false; });
              return;
            }
          } else if(typeof uiAlert === 'function'){
            uiAlert('Επίλεξε πρώτα γραμμές για διαγραφή.');
          }
        }catch(_){
        } finally {
          setTimeout(()=>{ window.__fbpDeleteAlertOpen = false; }, 300);
        }
      }

      window.FBP_DELETE = {
        collectMarks: collectDeleteMarks,
        closeModal: closeDeleteModal,
        openModal: openDeleteModal,
        showNoSelectionAlert: showDeleteSelectionAlert,
      };
    })();
    </script>

<script>
(function(){
  // Expose a lightweight reinitialization function so partial-refresh can call it.
  window.FBP_REINIT = function(){
    try{
      // try to perform minimal table recalculations and attach simple handlers
      // Prefer to run the full table initializer if available (preserves DataTables setup)
      if (typeof window.FBP_INIT_TABLE === 'function'){
        try{ 
          window.FBP_INIT_TABLE(); 
          // CRITICAL: Add delay to ensure DataTables scrolling footer is rebuilt
          (function retrySync(attempts){
            const table = document.querySelector('.summary-table');
            if(!table) return;
            try{ if(typeof computeAndRenderTotals==='function') computeAndRenderTotals(table); }catch(_){ }
            try{ if(typeof syncCloneFooter==='function') syncCloneFooter(table); }catch(_){ }

            // quick check whether the visible cloned footer has non-empty cells
            try{
              const $ = window.jQuery;
              if($ && $.fn && $.fn.dataTable && $.fn.dataTable.isDataTable(table)){
                const $wrap = $(table).closest('.dataTables_wrapper');
                const $clone = $wrap.find('.dataTables_scrollFoot table tfoot tr[data-totals="1"]');
                if($clone.length){
                  const hasContent = $clone.children().toArray().some(function(el){ return ($(el).text()||'').trim() !== ''; });
                  if(hasContent) return; // success
                }
              } else {
                const tfoot = table.tFoot;
                if(tfoot){
                  const tr = tfoot.querySelector('tr[data-totals="1"]');
                  if(tr){
                    const has = Array.from(tr.children).some(td => (td.textContent||'').trim() !== '');
                    if(has) return;
                  }
                }
              }
            }catch(_){ }

            if(attempts>0){
              // exponential-ish backoff for retries (short → longer)
              const delay = attempts>3 ? 300 : 150;
              setTimeout(function(){ retrySync(attempts-1); }, delay);
            }
          })(6);
          try{ if(window.FBP_INIT_TABULATOR) window.FBP_INIT_TABULATOR(); }catch(_){ }
          return; 
        }catch(_){ }
      }

      const table = document.querySelector('.summary-table');
      if(!table) return;
      // hide server totals rows and compute footer totals (best-effort)
      try{ if(typeof hideServerTotalsRows==='function') hideServerTotalsRows(table); }catch(_){ }
      try{ if(typeof ensureFooter==='function') ensureFooter(table); }catch(_){ }
      try{ if(typeof computeAndRenderTotals==='function') computeAndRenderTotals(table); }catch(_){ }
      try{ if(typeof syncCloneFooter==='function') syncCloneFooter(table); }catch(_){ }

      // Re-attach simple global search/filter
      const globalSearch = document.getElementById('globalSearch');
      if(globalSearch){
        const recalc = ()=>{
          const q = (globalSearch.value||'').toLowerCase();
          table.querySelectorAll('tbody tr').forEach(tr=>{
            if (tr.getAttribute && tr.getAttribute('data-server-totals')==='1') { tr.style.display='none'; return; }
            tr.style.display = (tr.innerText||tr.textContent||'').toLowerCase().includes(q) ? '' : 'none';
          });
          try{ if(typeof computeAndRenderTotals==='function') computeAndRenderTotals(table); }catch(_){ }
        };
        globalSearch.removeEventListener('input', recalc);
        globalSearch.addEventListener('input', ()=>setTimeout(recalc,0));
      }
    }catch(_){ }
  };

  const $ = window.jQuery;

  function greekNorm(s){
    return (s||'').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  }
  function parseLocalizedNumber(str){
    if (str===undefined || str===null) return 0;
    try{
      let s = String(str);
      // remove HTML tags
      s = s.replace(/<[^>]*>/g, '');
      // detect negative in parentheses like (1.234,56)
      let neg = false;
      if (/\(.*\)/.test(s)) { neg = true; s = s.replace(/[()]/g,''); }
      // keep only digits, dots, commas, minus
      s = s.replace(/[^0-9\-,.]/g, '').trim();
      if(!s) return 0;
      // Normalize thousands (.) and decimals (,) to a JS-friendly format
      s = s.replace(/\./g, '').replace(/,/g, '.');
      const v = parseFloat(s);
      if (!Number.isFinite(v)) return 0;
      return neg ? -v : v;
    }catch(_){ return 0; }
  }
  function formatGreekNumber(n){
    const sign = n<0?'-':'';
    const absn=Math.abs(Number(n)||0);
    const parts=absn.toFixed(2).split('.');
    const intPart=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    const decPart=parts[1]||'00';
    return sign+intPart+','+decPart;
  }

  function findHeaderIndexes(table){
    const ths = Array.from(table.querySelectorAll('thead th'));
    const names = ths.map(h => greekNorm(h.innerText || h.textContent || ''));
    const idx = (...alts) => names.findIndex(t => alts.map(greekNorm).includes(t));
    return {
      net:   idx('καθαρη αξια','καθαρη','καθαρή','net','netvalue','totalnet'),
      vat:   idx('φπα','vat'),
      total: idx('συνολο','total','totalvalue','sum')
    };
  }

  // Κρύψε τυχόν server-side «ΣΥΝΟΛΑ» μέσα στο tbody
  function hideServerTotalsRows(table){
    table.querySelectorAll('tbody tr').forEach(tr=>{
      const txt = greekNorm(tr.innerText || tr.textContent || '');
      if (txt.startsWith('συνολα')){
        tr.setAttribute('data-server-totals','1');
        tr.style.display='none';
      }
    });
  }

  // Δημιούργησε/συντήρησε footer με ίδιο πλήθος κελιών όπως τα headers
  function ensureFooter(table){
    let tfoot = table.tFoot;
    if(!tfoot){
      tfoot = document.createElement('tfoot');
      table.appendChild(tfoot);
    }
    table.appendChild(tfoot);
    const thCount = table.querySelectorAll('thead th').length;
    let tr = tfoot.querySelector('tr[data-totals="1"]');
    if (!tr){
      tfoot.innerHTML = '';
      tr = document.createElement('tr');
      tr.setAttribute('data-totals','1');
      for(let i=0;i<thCount;i++){
        const td=document.createElement('td');
        td.className='p-2 border text-right font-medium';
        if(i===0){ td.className='p-2 border text-left font-semibold'; td.textContent=''; } /* θα μπει με ::before */
        tr.appendChild(td);
      }
      tfoot.appendChild(tr);
    } else {
      const currentCount = tr.children.length;
      if (currentCount !== thCount){
        tfoot.innerHTML = '';
        return ensureFooter(table);
      }
    }
    return tr;
  }

  // Συγχρονισμός κλώνου footer & πλατών για τέλεια στοίχιση
  function syncCloneFooter(table){
    try{
      if (!($ && $.fn && $.fn.dataTable && $.fn.dataTable.isDataTable(table))) return;
      const $wrap  = $(table).closest('.dataTables_wrapper');
      const $clone = $wrap.find('.dataTables_scrollFoot table tfoot');
      if (!$clone.length || !table.tFoot) return;

      // 1) ίδιο περιεχόμενο
      $clone.html(table.tFoot.innerHTML);

      // 2) ίδιο πλάτος ανά στήλη με το thead
      const $headCells = $wrap.find('.dataTables_scrollHead table thead th');
      const $footCells = $clone.find('tr:first-child').children();
      $headCells.each(function(i){
        const w = $(this).outerWidth();
        $footCells.eq(i).css({ width: w, boxSizing:'border-box' });
      });
    }catch(_){}
  }
    // Κλείδωμα ύψους header (για να μη «μαζεύει» μετά από sorts/redraws)
  function lockHeaderHeight(tableOr$){
    try{
      const $t = ($ && $.fn) ? ($(tableOr$).length ? $(tableOr$) : $(tableOr$[0])) : null;
      if(!$t || !$t.length) return;
      const $wrap = $t.closest('.dataTables_wrapper');
      requestAnimationFrame(()=>{
        const $ths = $wrap.find('.dataTables_scrollHead thead th');
        if(!$ths.length) return;
        const maxH = Math.max.apply(null, $ths.map((i,el)=>$(el).outerHeight()).get());
        // Σταθεροποίησε ύψος για όλα τα th
        $ths.css({ height: maxH, boxSizing: 'border-box' });
      });
    }catch(_){}
  }


  function computeAndRenderTotals(table){
    const idxs = findHeaderIndexes(table);
    let net=0, vat=0, total=0;
    let netCol=-1, vatCol=-1, totalCol=-1;

    if ($ && $.fn && $.fn.dataTable && $.fn.dataTable.isDataTable(table)) {
      // Use DataTables API to compute totals using the current column order
      try{
        const dt = $(table).DataTable();
        // Build header texts in the current visible column order
        const headers = dt.columns().header().toArray().map(h => greekNorm((h.innerText||h.textContent||'')));

        function findIdxByKeys(keys){
          for(let i=0;i<headers.length;i++){
            for(let k=0;k<keys.length;k++){
              if(headers[i].includes(greekNorm(keys[k]))) return i;
            }
          }
          return -1;
        }

        netCol = findIdxByKeys(['καθαρη αξια','καθαρη','καθαρή','net','netvalue','totalnet']);
        vatCol = findIdxByKeys(['φπα','vat']);
        totalCol = findIdxByKeys(['συνολο','total','totalvalue','sum']);

        if(netCol >= 0){
          const data = dt.column(netCol, {search:'applied'}).data().toArray();
          data.forEach(v=> net += parseLocalizedNumber(String(v)));
        }
        if(vatCol >= 0){
          const data = dt.column(vatCol, {search:'applied'}).data().toArray();
          data.forEach(v=> vat += parseLocalizedNumber(String(v)));
        }
        if(totalCol >= 0){
          const data = dt.column(totalCol, {search:'applied'}).data().toArray();
          data.forEach(v=> total += parseLocalizedNumber(String(v)));
        }
      }catch(e){
        // Fallback to row iteration if DataTables access fails - use physical indexes
        netCol = idxs.net;
        vatCol = idxs.vat;
        totalCol = idxs.total;
        const dt = $(table).DataTable();
        dt.rows({ filter: 'applied' }).every(function(){
          const node = this.node();
          if (node && node.getAttribute && node.getAttribute('data-server-totals')==='1') return;
          const tds = $(this.node()).find('td').toArray();
          if (netCol  >= 0 && tds[netCol])   net   += parseLocalizedNumber(tds[netCol].innerText);
          if (vatCol  >= 0 && tds[vatCol])   vat   += parseLocalizedNumber(tds[vatCol].innerText);
          if (totalCol>= 0 && tds[totalCol]) total += parseLocalizedNumber(tds[totalCol].innerText);
        });
      }
    } else {
      // No DataTables - use physical column indexes
      netCol = idxs.net;
      vatCol = idxs.vat;
      totalCol = idxs.total;
      table.querySelectorAll('tbody tr').forEach(tr=>{
        if (tr.style.display==='none') return;
        if (tr.getAttribute && tr.getAttribute('data-server-totals')==='1') return;
        const tds = tr.querySelectorAll('td');
        if (netCol  >= 0 && tds[netCol])   net   += parseLocalizedNumber(tds[netCol].innerText);
        if (vatCol  >= 0 && tds[vatCol])   vat   += parseLocalizedNumber(tds[vatCol].innerText);
        if (totalCol>= 0 && tds[totalCol]) total += parseLocalizedNumber(tds[totalCol].innerText);
      });
    }

    // Write totals to footer using the current visual column order
    const tr = ensureFooter(table);
    const tds = tr.querySelectorAll('td');
    if (netCol  >= 0 && tds[netCol])   tds[netCol].textContent   = formatGreekNumber(net);
    if (vatCol  >= 0 && tds[vatCol])   tds[vatCol].textContent   = formatGreekNumber(vat);
    if (totalCol>= 0 && tds[totalCol]) tds[totalCol].textContent = formatGreekNumber(total);

    syncCloneFooter(table);
  }

  // Main table initializer: Tabulator-only now; keep a no-op shim for legacy callers
  window.FBP_INIT_TABLE = function(){
    // We rely on Tabulator instead of DataTables; ensure any old wrappers are removed
    try{ document.querySelectorAll('.dataTables_wrapper').forEach(el=>el.remove()); }catch(_){ }
  };

  // Run on initial load (Tabulator init happens separately)
  document.addEventListener('DOMContentLoaded', function(){ try{ window.FBP_INIT_TABLE(); }catch(_){ } });
})();  

/* ======= ΔΕΥΤΕΡΟ SCRIPT (όπως το είχες) — τρέχει ΜΟΝΟ χωρίς DataTables ======= */
(function(){
  const qs = (s,r=document)=>r.querySelector(s);
  const qsa = (s,r=document)=>Array.from((r||document).querySelectorAll(s));

  function parseLocalizedNumber(str){
    if(!str) return 0;
    try{
      let s = String(str);
      s = s.replace(/<[^>]*>/g, '');
      let neg = false;
      if (/\(.*\)/.test(s)) { neg = true; s = s.replace(/[()]/g,''); }
      s = s.replace(/[^0-9\-,.]/g, '').trim();
      if(!s) return 0;
      s = s.replace(/\./g, '').replace(/,/g, '.');
      const v = parseFloat(s);
      if(!isFinite(v)) return 0;
      return neg ? -v : v;
    }catch(_){ return 0; }
  }

  function formatGreekNumber(n){
    if(n===null||n===undefined) n=0;
    const sign = n<0?'-':'';
    const absn=Math.abs(Number(n)||0);
    const parts=absn.toFixed(2).split('.');
    const intPart=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    const decPart=parts[1]||'00';
    return sign+intPart+','+decPart;
  }

  function reorderColumns(){
    const table = qs('.summary-table');
    if(!table) return;
    const headers = Array.from(table.querySelectorAll('thead th'));
    const headerTexts = headers.map(h => (h.innerText || h.textContent || '').trim().toLowerCase());
    const moveLast = ['φπα_κατηγορια','είδος'];
    const indexesToMove = moveLast.map(name => headerTexts.findIndex(h => h === name.toLowerCase()))
                                  .filter(idx => idx >= 0);
    if(!indexesToMove.length) return;
    const allRows = [ ...qsa('thead tr', table), ...qsa('tbody tr', table) ];
    allRows.forEach(tr => {
      indexesToMove.forEach(idx => {
        const cell = tr.children[idx];
        if(cell) tr.appendChild(cell);
      });
    });
  }

  function computeTableTotals(){
    try {
      const table=qs('.summary-table');
      if(!table) return;
      const thead=table.querySelector('thead');
      const headers=thead?Array.from(thead.querySelectorAll('th')):[];
      const headerTexts=headers.map(h => (h.innerText || h.textContent || '').toString().trim().toLowerCase());

      const netKeys=['καθαρή','καθαρη','net','netvalue','totalnet','καθαρη αξια','καθαρή αξία'];
      const vatKeys=['φπα','vat']; 
      const totalKeys=['σύνολο','συνολο','total','totalvalue','sum'];

      function findIndexByKeywords(keys){
        for(let i=0;i<headerTexts.length;i++){
          const t=headerTexts[i];
          if(!t) continue;
          for(const k of keys) if(t===k) return i;
        }
        return -1;
      }

      const netIdx=findIndexByKeywords(netKeys);
      const vatIdx=findIndexByKeywords(vatKeys);
      const totalIdx=findIndexByKeywords(totalKeys);

      let netSum=0, vatSum=0, totalSum=0;
      const tbody=table.querySelector('tbody');
      if(!tbody) return;

      Array.from(tbody.querySelectorAll('tr')).forEach(tr=>{
        if(tr.style.display==='none') return; // Μόνο ορατές γραμμές
        const tds=Array.from(tr.querySelectorAll('td'));
        if(netIdx>=0 && tds[netIdx]) netSum+=parseLocalizedNumber(tds[netIdx].innerText);
        if(vatIdx>=0 && tds[vatIdx]) vatSum+=parseLocalizedNumber(tds[vatIdx].innerText);
        if(totalIdx>=0 && tds[totalIdx]) totalSum+=parseLocalizedNumber(tds[totalIdx].innerText);
      });

      const existingTfoot=table.querySelector('tfoot');
      if(existingTfoot) existingTfoot.remove();

      const tfoot=document.createElement('tfoot');
      const tr=document.createElement('tr');
      const colCount=headers.length || (table.querySelectorAll('tr:first-child td').length || 0);

      for(let i=0;i<colCount;i++){
        const td=document.createElement('td');
        td.className='p-2 border text-right font-medium';
        if(i===0){
          td.className='p-2 border text-left font-semibold';
          td.innerText='ΣΥΝΟΛΑ';
        } else if(i===netIdx) td.innerText=formatGreekNumber(netSum);
        else if(i===vatIdx) td.innerText=formatGreekNumber(vatSum);
        else if(i===totalIdx) td.innerText=formatGreekNumber(totalSum);
        else td.innerText='';
        tr.appendChild(td);
      }
      tfoot.appendChild(tr);
      table.appendChild(tfoot);
    } catch(e){ console.warn('computeTableTotals failed', e); }
  }

  document.addEventListener('DOMContentLoaded', function(){
    // ΜΟΝΟ όταν δεν υπάρχει DataTables
    const hasDT = !!(window.jQuery && jQuery.fn && jQuery.fn.dataTable && jQuery('.summary-table').length && jQuery.fn.dataTable.isDataTable(jQuery('.summary-table')[0]));
    if (hasDT) return;

    reorderColumns();
    computeTableTotals();

    const firstTh = qs('.summary-table thead th:first-child');
    if(firstTh) firstTh.style.width = '40px';
    qsa('.summary-table tbody tr').forEach(tr => {
      const firstTd = tr.querySelector('td:first-child');
      if(firstTd) firstTd.style.width = '40px';
    });

    const tbody = qs('.summary-table tbody');
    if(tbody){
      tbody.addEventListener('dblclick', e => {
        const tr = e.target.closest('tr');
        if(!tr) return;
        const cb = tr.querySelector('input[name="delete_mark"]');
        if(cb) cb.checked = !cb.checked;
      });
    }

    const globalSearch = qs('#globalSearch');
    function applyFilter(){
      const q = (globalSearch.value||'').toLowerCase();
      qsa('.summary-table tbody tr').forEach(tr=>{
        tr.style.display = tr.innerText.toLowerCase().includes(q)?'':'none';
      });
      computeTableTotals();
    }
    if(globalSearch){
      globalSearch.addEventListener('input', applyFilter);
      globalSearch.addEventListener('keyup', e => {
        if(['Delete','Backspace'].includes(e.key) || (e.metaKey||e.ctrlKey && e.key.toLowerCase()==='a')){
          setTimeout(applyFilter, 10);
        }
      });
      globalSearch.addEventListener('keydown', e=>{
        if(e.key==='Escape'){
          globalSearch.value='';
          applyFilter();
        }
      });
      const mo = new MutationObserver(applyFilter);
      mo.observe(globalSearch, { attributes:true, attributeFilter:['value'] });
      window.addEventListener('beforeunload', ()=>mo.disconnect());
    }

    const toggle = qs('#downloadToggle'), menu = qs('#downloadMenu');
    if(toggle && menu){
      toggle.addEventListener('click', e=>{
        e.stopPropagation();
        menu.classList.toggle('hidden');
        toggle.setAttribute('aria-expanded', menu.classList.contains('hidden')?'false':'true');
      });
      document.addEventListener('click', e=>{
        if(!menu.classList.contains('hidden') && !menu.contains(e.target) && !toggle.contains(e.target)){
          menu.classList.add('hidden');
          toggle.setAttribute('aria-expanded','false');
        }
      });
      
    }

    const cancelBtn=qs('#deleteCancel');
    if(cancelBtn && window.FBP_DELETE){
      cancelBtn.addEventListener('click', ()=> window.FBP_DELETE.closeModal());
    }
  });
})();
</script>

<script>
// --- DELETE HANDLER: δουλεύει ΚΑΙ με DataTables ΚΑΙ χωρίς ---
(function(){
  const $ = window.jQuery;
  function collectCheckedMarks(){
    if(window.FBP_DELETE && typeof window.FBP_DELETE.collectMarks === 'function'){
      return window.FBP_DELETE.collectMarks();
    }
    // Combine Tabulator live selection with any legacy DOM checkboxes and dedupe
    try{
      const set = new Set();
      // Tabulator live selection
      if (window && window.FBP_TABULATOR && typeof window._fbp_collect_marks_from_tabulator === 'function'){
        const fromTab = window._fbp_collect_marks_from_tabulator() || [];
        if(Array.isArray(fromTab)) fromTab.forEach(v=>{ if(v) set.add(String(v).trim()); });
      }
      // DOM checkbox fallback: resolve 'on' to real MARK using row parsing / data-mark
      const origTable = document.querySelector('.summary-table');
      const thead = origTable ? origTable.querySelector('thead') : null;
      const colCount = thead ? thead.querySelectorAll('th').length || 0 : 0;
      const markColIndex = thead ? findMarkCol(thead) : -1;
      Array.from(document.querySelectorAll('input[name="delete_mark"]:checked')).forEach(cb=>{
        try{
          if(!cb) return;
          const v = (cb.value||'').toString().trim();
          if(v && v.toLowerCase() !== 'on') { set.add(v); return; }
          if(cb.dataset && cb.dataset.mark){ set.add(String(cb.dataset.mark).trim()); return; }
          const tr = cb.closest && cb.closest('tr');
          if(tr){ const d = parseRowToData(tr, colCount, markColIndex); if(d && d._mark) set.add(String(d._mark).trim()); }
        }catch(_){ }
      });
      return Array.from(set);
    }catch(_){
      return [];
    }
  }

  document.addEventListener('DOMContentLoaded', function(){
    const deleteBtn   = document.getElementById('deleteBtn');
    const modal       = document.getElementById('deleteModal');
    const modalMsg    = document.getElementById('deleteModalMessage');
    const cancelBtn   = document.getElementById('deleteCancel');
    const confirmBtn  = document.getElementById('deleteConfirm');
    const spinner     = document.getElementById('deleteSpinner');

    if(!deleteBtn || !modal || !confirmBtn) return;
    if(deleteBtn.dataset.deleteBound === '1') return;
    deleteBtn.dataset.deleteBound = '1';

    deleteBtn.addEventListener('click', (event)=>{
      event.preventDefault();
      const toDelete = collectCheckedMarks();
      if (!toDelete.length){
        if(window.FBP_DELETE && typeof window.FBP_DELETE.showNoSelectionAlert === 'function'){
          window.FBP_DELETE.showNoSelectionAlert();
        }
        return;
      }
      if(window.FBP_DELETE && typeof window.FBP_DELETE.openModal === 'function'){
        window.FBP_DELETE.openModal(toDelete.length);
      } else {
        if (modalMsg) modalMsg.textContent = `Θες σίγουρα να διαγράψεις ${toDelete.length} εγγραφή(ες);`;
        modal.style.display = 'flex';
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      }

      // override τυχόν προηγούμενα handlers για να μη διπλοστέλνει
      confirmBtn.onclick = async ()=>{
        // Re-collect marks at confirmation time (in case selection changed)
        const tdelete = collectCheckedMarks() || [];
        if(!tdelete.length){
          if(window.FBP_DELETE && typeof window.FBP_DELETE.closeModal === 'function'){
            window.FBP_DELETE.closeModal();
          } else if(modal){
            modal.style.display='none';
            modal.classList.add('hidden');
            modal.classList.remove('flex');
          }
          return;
        }
        confirmBtn.disabled = true;
        if (spinner) spinner.classList.remove('hidden');

        try{
          const endpoint = (window.DELETE_ENDPOINT || "{{ url_for('delete_invoices') }}");
          const body = new URLSearchParams();

          const existingCsrf = document.querySelector('input[name="csrf_token"]');
          if (existingCsrf && existingCsrf.value) {
            body.append('csrf_token', existingCsrf.value);
          }

          tdelete.forEach(v => {
            body.append('delete_mark', v);
            body.append('delete_mark[]', v);
          });
          body.append('delete_mark_json', JSON.stringify(tdelete));
          body.append('delete_marks_json', JSON.stringify(tdelete));
          body.append('delete_marks', tdelete.join(','));
          body.append('marks', tdelete.join(','));
          body.append('client_submitted_marks', JSON.stringify(tdelete));
          body.append('ajax', '1');

          const res = await fetch(endpoint, {
            method: 'POST',
            credentials: 'same-origin',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
              'X-Requested-With': 'XMLHttpRequest'
            },
            body: body.toString()
          });

          const payload = await res.json().catch(() => null);
          if(!res.ok || !payload || payload.ok === false){
            const msg = (payload && (payload.error || payload.message)) ? (payload.error || payload.message) : ('Αποτυχία διαγραφής (HTTP ' + res.status + ')');
            if (typeof showFlash === 'function') showFlash(msg, 'error', 5000);
            else if (typeof showModalAlert === 'function') await showModalAlert('Σφάλμα', msg);
            return;
          }

          const frag = await fetch('/list/fragment', { method: 'GET', credentials: 'same-origin' });
          if (frag.ok) {
            const j = await frag.json().catch(() => null);
            if (j && j.ok && j.table_html) {
              const container = document.getElementById('summary-container');
              if (container) {
                container.innerHTML = j.table_html;
                setTimeout(() => {
                  try {
                    if (typeof window.FBP_INIT_TABULATOR === 'function') window.FBP_INIT_TABULATOR();
                    else if (typeof window.FBP_REINIT === 'function') window.FBP_REINIT();
                  } catch(_){ }
                }, 40);
              }
            }
          }

          if(window.FBP_DELETE && typeof window.FBP_DELETE.closeModal === 'function'){
            window.FBP_DELETE.closeModal();
          } else if(modal){
            modal.style.display='none';
            modal.classList.add('hidden');
            modal.classList.remove('flex');
          }

          const okMsg = payload.message || 'Οι επιλεγμένες εγγραφές διαγράφηκαν.';
          if (typeof showFlash === 'function') showFlash(okMsg, 'success', 3000);
        } catch(err){
          console.warn('delete ajax failed', err);
          const msg = 'Σφάλμα δικτύου κατά τη διαγραφή.';
          if (typeof showFlash === 'function') showFlash(msg, 'error', 5000);
          else if (typeof showModalAlert === 'function') await showModalAlert('Σφάλμα', msg);
        } finally {
          confirmBtn.disabled = false;
          if (spinner) spinner.classList.add('hidden');
        }
      };
    });

    if (cancelBtn){
      cancelBtn.addEventListener('click', ()=>{
        if(window.FBP_DELETE && typeof window.FBP_DELETE.closeModal === 'function'){
          window.FBP_DELETE.closeModal();
          return;
        }
        modal.style.display='none';
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      });
    }
  });
})();
</script>

<!-- Live-update polling for shared active client -->
<script>
(function(){
  const POLL_INTERVAL = 6000; // ms
  let pollTimer = null;
  let lastEventsHash = '';
  const CURRENT_USER_EMAIL = "{{ current_user.email if current_user and current_user.is_authenticated else '' }}";
  const CURRENT_USER_ID = "{{ current_user.id if current_user and current_user.is_authenticated else '' }}";

  function showToast(msg){
    try{
      let t = document.getElementById('fbp-live-toast');
      if(!t){
        t = document.createElement('div');
        t.id = 'fbp-live-toast';
        t.style.position = 'fixed';
        t.style.right = '16px';
        t.style.top = '16px';
        t.style.zIndex = 99999;
        document.body.appendChild(t);
      }
      const el = document.createElement('div');
      el.className = 'p-3 mb-2 rounded shadow bg-blue-600 text-white';
      el.style.minWidth = '220px';
      el.textContent = msg;
      t.appendChild(el);
      setTimeout(()=>{ el.style.transition='opacity 0.4s'; el.style.opacity='0'; setTimeout(()=>el.remove(),450); }, 5000);
    }catch(_){ }
  }

  async function checkUpdates(){
    try{
      const res = await fetch('/activity/check_updates');
      if(!res.ok) return;
      const data = await res.json();
      if(!data || !data.ok) return;
      const events = data.events || [];
      if(!events.length) return;
      // simple dedupe by JSON string
      const hash = JSON.stringify(events.map(e=>({a:e.action,t:e.timestamp,actor:e.actor}))); 
      if(hash === lastEventsHash) return;
      lastEventsHash = hash;

      // filter out events caused by current user
      const others = events.filter(e=>{
        const actor = String(e.actor||'').toLowerCase();
        if(!actor) return true;
        if(CURRENT_USER_EMAIL && actor.includes(String(CURRENT_USER_EMAIL).toLowerCase())) return false;
        if(CURRENT_USER_ID && actor.includes(String(CURRENT_USER_ID).toLowerCase())) return false;
        return true;
      });
      if(!others.length) return;

      // show simple message for the first event and refresh the inner table fragment
      const ev = others[0];
      const actorName = ev.actor || 'Κάποιος';
      const action = (ev.action || 'update');
      const human = ev.summary || action;
      const message = `${actorName} έκανε αλλαγή: ${human}`;
      // Prefer the existing global showFlash if available, else fallback to inline toast
      if (typeof window.showFlash === 'function'){
        try{ window.showFlash(message, 'info', 4000); }catch(_){ showToast(message); }
      } else if (typeof showFlash === 'function'){
        try{ showFlash(message, 'info', 4000); }catch(_){ showToast(message); }
      } else {
        showToast(message);
      }
      // fetch updated table by requesting the full /list page and extracting
      // the `#summary-container` fragment. Use Tabulator-only path (remove legacy DataTables wrappers).
      try{
        const listUrl = window.location.pathname.indexOf('/list')===0 ? window.location.href : '/list';
        const pageResp = await fetch(listUrl);
        if(pageResp && pageResp.ok){
          const text = await pageResp.text();
          const parser = new DOMParser();
          const doc = parser.parseFromString(text, 'text/html');
          const newContainer = doc.getElementById('summary-container');
          const container = document.getElementById('summary-container');
          if(newContainer && container){
            const newHtml = newContainer.innerHTML;
            try{ container.querySelectorAll('.dataTables_wrapper, .tabulator-wrapper').forEach(el=>el.remove()); }catch(_){ }
            container.innerHTML = newHtml;
            try{ setTimeout(()=>{ if(window.FBP_INIT_TABULATOR) window.FBP_INIT_TABULATOR(); }, 30); }catch(_){ }
            return;
          }
        }
      }catch(_){ /* fall through to fragment fallback */ }

      // Fallback: fetch the fragment endpoint (older behaviour) -> still Tabulator-only
      try{
        const frag = await fetch('/list/fragment');
        if(frag && frag.ok){
          const j = await frag.json();
          if(j && j.ok && j.table_html){
            const container = document.getElementById('summary-container');
            if(container){
              try{ container.querySelectorAll('.dataTables_wrapper, .tabulator-wrapper').forEach(el=>el.remove()); }catch(_){ }
              container.innerHTML = j.table_html;
              try{ setTimeout(()=>{ if(window.FBP_INIT_TABULATOR) window.FBP_INIT_TABULATOR(); }, 30); }catch(_){ }
            }
          }
        }
      }catch(_){ /* silent */ }
    }catch(_){ /* silent */ }
  }

  function startPolling(){
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(checkUpdates, POLL_INTERVAL);
  }

  document.addEventListener('DOMContentLoaded', ()=>{
    startPolling();
  });
})();
</script>

<script>
// Tabulator migration: build a Tabulator instance from the server-rendered table
(function(){
  function buildColumnsFromThead(thead){
    const ths = Array.from(thead.querySelectorAll('th'));
    return ths.map((th, i) => ({ title: (th.innerText||th.textContent||'').trim(), field: 'c'+i, headerSort: true, headerFilter:false }));
  }

  function detectNumericHeader(txt){
    const t = (txt||'').toString().toLowerCase();
    return ['καθαρη','καθαρή','καθαρη αξια','καθαρή αξία','φπα','vat','συνολο','σύνολο','total','totalvalue','sum'].some(k=> t.includes(k));
  }

  function findMarkCol(thead){
    try{
      const ths = Array.from(thead.querySelectorAll('th'));
      const names = ths.map(h => (h.innerText||h.textContent||'').trim().toLowerCase());
      const candidates = ['mark','αριθμός μητρώου','αριθμος μητρωου','αριθμος','αα','aa','invoice_id','invoice id','id','αρ. μητρώου','αριθμός'];
      for(let i=0;i<names.length;i++){
        const n = names[i];
        if(!n) continue;
        for(const c of candidates){ if(n.includes(c)) return i; }
      }
      // last resort: look for any header that literally equals 'mark' or contains 'mark' (latin)
      for(let i=0;i<names.length;i++){ if(names[i].includes('mark')) return i; }
      return -1;
    }catch(_){ return -1; }
  }

  function findDateCol(thead){
    try{
      const ths = Array.from(thead.querySelectorAll('th'));
      const names = ths.map(h => (h.innerText||h.textContent||'').trim().toLowerCase());
      const candidates = ['ημερομηνία','ημερομηνιa','ημερ','date','ημ.','ημ'];
      for(let i=0;i<names.length;i++){
        for(const c of candidates) if(names[i].includes(c)) return i;
      }
      return -1;
    }catch(_){ return -1; }
  }

  function findEntryDateCol(thead){
    try{
      const ths = Array.from(thead.querySelectorAll('th'));
      const names = ths.map(h => (h.innerText||h.textContent||'').trim().toLowerCase());
      // Priority order: entry date > insertion date > generic date
      const entryDateCandidates = ['ημερομηνία εισαγωγής', 'εισαγωγή', 'entry date', 'inserted', 'created'];
      const genericDateCandidates = ['ημερομηνία','ημερομηνιa','ημερ','date','ημ.','ημ'];
      
      // First try to find specific entry/insertion date columns
      for(let i=0;i<names.length;i++){
        for(const c of entryDateCandidates) {
          if(names[i].includes(c)) return i;
        }
      }
      
      // Fallback to generic date columns
      for(let i=0;i<names.length;i++){
        for(const c of genericDateCandidates) {
          if(names[i].includes(c)) return i;
        }
      }
      
      return -1;
    }catch(_){ return -1; }
  }

  function parseRowToData(tr, colCount, markCol){
    const tds = Array.from(tr.children || []);
    const obj = {};
    for(let i=0;i<colCount;i++){
      const td = tds[i];
      const html = td ? td.innerHTML : '';
      const text = td ? (td.innerText||td.textContent||'').trim() : '';
      obj['c'+i] = text;
      // also expose raw html if needed
      obj['c'+i+'_html'] = html;
    }
    // 1) prefer explicit checkbox/input named delete_mark
    try{
      const cb = tr.querySelector('input[name="delete_mark"], input[name^="delete_mark"]');
      if(cb){
        const v = (cb.value||'').toString().trim();
        if(v && v.toLowerCase() !== 'on') {
          obj._mark = v;
        } else {
          try{ if(cb.dataset && cb.dataset.mark) obj._mark = String(cb.dataset.mark).trim(); }catch(_){ }
        }
      }
    }catch(_){ }

    // 2) try data-mark attribute on the row
    if(!obj._mark){
      try{ const dm = tr.getAttribute && tr.getAttribute('data-mark'); if(dm) obj._mark = String(dm).trim(); }catch(_){ }
    }

    // 3) try MARK column text (if markCol detected)
    if(!obj._mark && markCol>=0){
      const maybe = obj['c'+markCol];
      if(maybe) obj._mark = String(maybe).trim();
    }

    // 4) fallback: scan cells for an id-like token (long numeric or alphanumeric)
    if(!obj._mark){
      for(let i=0;i<colCount;i++){
        const v = obj['c'+i] || '';
        if(!v) continue;
        const digitsOnly = v.replace(/\D/g,'');
        if(digitsOnly.length >= 8){ obj._mark = v.trim(); break; }
        if(/mark/i.test(v)) { obj._mark = v.trim(); break; }
      }
    }

    // final normalize
    if(obj._mark) obj._mark = String(obj._mark).trim();
    return obj;
  }

  // expose helpers for other scripts (fallbacks) to reuse
  try{ window.parseRowToData = parseRowToData; }catch(_){ }
  try{ window.findMarkCol = findMarkCol; }catch(_){ }
  try{ window.findDateCol = findDateCol; }catch(_){ }
  try{ window.findEntryDateCol = findEntryDateCol; }catch(_){ }

  function toNumberLocalized(s){
    if(s===undefined||s===null) return 0;
    try{
      let v = String(s).replace(/<[^>]*>/g,'').trim();
      let neg=false; if(/\(.*\)/.test(v)){ neg=true; v=v.replace(/[()]/g,''); }
      v = v.replace(/[^0-9\-,.]/g,'').trim(); if(!v) return 0;
      v = v.replace(/\./g,'').replace(/,/g,'.');
      const n = parseFloat(v); if(!isFinite(n)) return 0; return neg? -n : n;
    }catch(_){return 0;}
  }

  function formatGreekNumberLocal(n){
    const sign = n<0?'-':''; const absn = Math.abs(Number(n)||0);
    const parts = absn.toFixed(2).split('.'); const intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.'); const decPart = parts[1]||'00';
    return sign+intPart+','+decPart;
  }

  // Extract Tabulator init into a re-usable function so partial reloads
  // can reinitialize / restore selection reliably.
  window.FBP_INIT_TABULATOR = function(){
    try{
      // Destroy previous instance if present
      try{
        if(window.FBP_TABULATOR && typeof window.FBP_TABULATOR.destroy === 'function'){
          try{ window.FBP_TABULATOR.destroy(); }catch(_){ }
          const oldWrap = document.querySelector('.tabulator-wrapper');
          if(oldWrap) oldWrap.remove();
          window.FBP_TABULATOR = null;
        }
      }catch(_){ }

      const origTable = document.querySelector('.summary-table');
      if(!origTable) return;

      const thead = origTable.querySelector('thead');
      if(!thead) return;
      const colCount = thead.querySelectorAll('th').length || 0;
      const markColIndex = findMarkCol(thead);
      // attempt to restore user-set column widths from localStorage
      let storedWidths = {};
      try{ storedWidths = JSON.parse(localStorage.getItem('fbp_tab_col_widths') || '{}') || {}; }catch(_){ storedWidths = {}; }

      const columns = buildColumnsFromThead(thead).map((col, i)=>{
        const isNum = detectNumericHeader(col.title);
        const isDate = /ημερ|date|ημ\.|ημ$/i.test(col.title);
        const colDef = Object.assign({}, col, { hozAlign: (i===0? 'left' : (isNum? 'right' : 'left')), headerSort: true, resizable:true });
        // restore width if user previously resized this column
        try{ const w = storedWidths[col.field]; if(w && Number(w)>0) colDef.width = Number(w); }catch(_){ }
        // Hide second column (index 1) - usually checkmark/icon column
        if(i===0){ colDef.visible = false; }
        if(isDate){
          // Custom date sorter that sorts by month first, then by day
          colDef.sorter = function(a, b, aRow, bRow, column, dir, sorterParams){
            try{
              const parseGreekDate = (str) => {
                if(!str) return new Date(0);
                // Handle dd/mm/yyyy or dd-mm-yyyy format
                const cleaned = String(str).trim().replace(/[-]/g, '/');
                const parts = cleaned.split('/');
                if(parts.length === 3){
                  const day = parseInt(parts[0], 10);
                  const month = parseInt(parts[1], 10) - 1; // 0-based months
                  const year = parseInt(parts[2], 10);
                  return new Date(year, month, day);
                }
                return new Date(str);
              };
              
              const dateA = parseGreekDate(a);
              const dateB = parseGreekDate(b);
              
              // Sort by month first, then by day
              const monthA = dateA.getMonth();
              const monthB = dateB.getMonth();
              if(monthA !== monthB) return monthA - monthB;
              
              const dayA = dateA.getDate();
              const dayB = dateB.getDate();
              if(dayA !== dayB) return dayA - dayB;
              
              // If same month and day, sort by year
              return dateA.getFullYear() - dateB.getFullYear();
            }catch(_){
              return String(a).localeCompare(String(b));
            }
          };
        }
        if(isNum){
          colDef.bottomCalc = 'sum';
          colDef.bottomCalcFormatter = function(cell){ return formatGreekNumberLocal(cell.getValue()); };
          colDef.accessor = function(value, data, type, params){ if(type === 'mutate' || type === 'download') return value; return toNumberLocalized(value); };
          colDef.formatter = function(cell){ const raw = cell.getValue(); return formatGreekNumberLocal(Number(raw)||0); };
        } else {
          if(i===0){
            colDef.bottomCalc = function(values, data){ return ''; };
            colDef.bottomCalcFormatter = function(cell){ return ''; };
          }
          colDef.formatter = function(cell){ return (cell.getValue()||''); };
        }
        return colDef;
      });

      // restore column order from localStorage (field names array) if present
      try{
        const storedOrder = JSON.parse(localStorage.getItem('fbp_tab_col_order') || '[]') || [];
        if(Array.isArray(storedOrder) && storedOrder.length){
          const remaining = columns.slice();
          const ordered = [];
          storedOrder.forEach(fld => {
            const idx = remaining.findIndex(c=>c.field === fld);
            if(idx >= 0) ordered.push(remaining.splice(idx,1)[0]);
          });
          // append any not in stored list
          columns = ordered.concat(remaining);
        }
      }catch(_){ /* ignore */ }

      // prepend a selection column for delete checkboxes similar to current UI
      columns.unshift({
        formatter:'rowSelection',
        hozAlign:'center',
        headerSort:false,
        width:40,
        frozen:true,
        titleFormatter:function(cell){
          const table = cell.getTable();
          const box = document.createElement('input'); 
          box.type='checkbox';
          box.addEventListener('change', ()=>{
            // Get ONLY the rows in the current page/viewport
            let paginatedRows = [];
            let totalRows = 0;
            try {
              const allRows = table.getRows();
              totalRows = allRows.length;
              
              paginatedRows = allRows.filter(row => {
                try {
                  const el = row.getElement();
                  // offsetParent is null if element is display:none or not in document
                  return el && el.offsetParent !== null;
                } catch(e) {
                  return false;
                }
              });
              
              console.log(`[Tabulator SelectAll] Total rows: ${totalRows}, Visible rows: ${paginatedRows.length}, Checked: ${box.checked}`);
            } catch(e) {
              console.warn('Error getting paginated rows:', e);
              // Fallback: if filtering fails, don't select all to avoid selecting hidden rows
              paginatedRows = [];
            }
            
            if(box.checked) { 
              table.selectRow(paginatedRows);
              console.log(`[Tabulator SelectAll] Selected ${paginatedRows.length} rows`);
            }
            else { 
              table.deselectRow(paginatedRows);
              console.log(`[Tabulator SelectAll] Deselected ${paginatedRows.length} rows`);
            }
          });
          return box;
        }
      });

      // parse tbody rows into data
      const tbody = origTable.querySelector('tbody');
      const rows = [];
      if(tbody){
        // Read table rows in reverse order (last to first)
        const allTrs = Array.from(tbody.querySelectorAll('tr'));
        for(let i = allTrs.length - 1; i >= 0; i--){
          const tr = allTrs[i];
          if(tr.getAttribute && tr.getAttribute('data-server-totals')==='1') continue; // skip server totals
          const d = parseRowToData(tr, colCount, markColIndex);
          // convert numeric fields to numbers for Tabulator sums
          for(let j=0;j<colCount;j++){
            const hdrText = (thead.querySelectorAll('th')[j]||{}).innerText || '';
            if(detectNumericHeader(hdrText)){
              d['c'+j] = toNumberLocalized(d['c'+j]);
            }
          }
          rows.push(d);
        }
      }

      // create wrapper and init Tabulator
      const wrapper = document.createElement('div'); wrapper.className = 'tabulator-wrapper';
      origTable.parentNode.insertBefore(wrapper, origTable);
      // hide original table (keep in DOM for server-side expectations but hidden)
      origTable.style.display = 'none';

      // page length from localStorage
      let pageSize = 10;
      try{ const stored = localStorage.getItem('fbp_tab_page_len'); if(stored) pageSize = parseInt(stored,10) || 10; }catch(_){ }

      // Rows are already read in reverse order above

      const tab = new Tabulator(wrapper, {
        data: rows,
        layout: 'fitColumns',
        columns: columns,
        // Initial height -- will be adjusted dynamically below
        height: 'auto',
        movableColumns: true,
        selectable: true,
        tooltips: false,
        resizableColumns: true,
        placeholder: 'Δεν υπάρχουν εγγραφές προς εμφάνιση',
        index: '_mark',
        footerElement: null,
        pagination: 'local',
        paginationSize: pageSize,
        // No initial sort since we already reversed the rows
        // paginationSizeSelector removed to hide Tabulator's built-in page-size menu
      });

      // STATUS / PAGE-LENGTH UI: page label already in markup, just wire persistence
      try{
        const pageLabel = document.querySelector('#pageLengthSelect');
        if(pageLabel){
          const v = parseInt(pageLabel.value, 10) || 10;
          try{ localStorage.setItem('fbp_tab_page_len', String(v)); }catch(_){ }
        }
      }catch(_){ }

      // Persist column order when user moves columns
      try{
        tab.on('columnMoved', function(column){
          try{
            const cols = tab.getColumns();
            const order = cols.map(c=> { try{ return c.getField(); }catch(_){ return null; } }).filter(x=>x);
            try{ localStorage.setItem('fbp_tab_col_order', JSON.stringify(order)); }catch(_){}
          }catch(_){ }
        });
      }catch(_){ }

      // Dynamically compute Tabulator height based on visible rows (avoid needless empty space)
      function setTabulatorHeight(tabInstance){
        try{
          const rowHeight = 40; // approximate row height in px
          const headerEl = wrapper.querySelector('.tabulator-header');
          const footerEl = wrapper.querySelector('.tabulator-footer');
          const headerH = headerEl ? headerEl.offsetHeight : 48;
          const footerH = footerEl ? footerEl.offsetHeight : 42;
          const pad = 24; // extra padding
          const pageSizeNow = (tabInstance && typeof tabInstance.getPageSize === 'function') ? tabInstance.getPageSize() : pageSize;
          const activeCount = (tabInstance && typeof tabInstance.getDataCount === 'function') ? tabInstance.getDataCount('active') : rows.length;
          const rowsToShow = Math.max(1, Math.min(pageSizeNow || pageSize, activeCount || pageSize));
          const max = Math.round(window.innerHeight * 0.72); // cap near viewport

          // For few visible rows, fit to data to avoid tall empty body
          if(rowsToShow <= Math.min(pageSizeNow || pageSize, 8)){
            tabInstance.setMaxHeight(max);
            tabInstance.setHeight('fitData');
            try{ tabInstance.redraw(true); }catch(_){ }
            return;
          }

          const desired = headerH + footerH + (rowsToShow * rowHeight) + pad;
          const min = headerH + footerH + (Math.min(rowsToShow, 3) * rowHeight);
          const h = Math.max(min, Math.min(desired, max));
          tabInstance.setMaxHeight(max);
          tabInstance.setHeight(h);
        }catch(_){ }
      }

      // set initial height after a tick so Tabulator DOM is ready
      try{ setTimeout(()=>{ setTabulatorHeight(tab); }, 50); }catch(_){ }

      // adjust when page size selector changes
      try{
        const lenSel = document.getElementById('pageLengthSelect');
        if(lenSel){
          lenSel.addEventListener('change', ()=>{
            const v = parseInt(lenSel.value,10) || 10;
            try{ tab.setPageSize(v); }catch(_){ }
            setTabulatorHeight(tab);
          });
        }
      }catch(_){ }

      // inject footer row 'ΣΥΝΟΛΑ' rendered below - Tabulator puts bottomCalc values in footer cells
      const footer = document.createElement('div');
      footer.className = 'tabulator-footer';
      footer.style.display = 'block';
      footer.style.background = '#f8fafc';
      footer.style.borderTop = '2px solid #0d6efd';
      footer.style.padding = '8px 0';
      wrapper.appendChild(footer);

      function renderFooter(){
        try{
          const colDefs = tab.getColumnDefinitions();
          const cols = tab.getColumns();
          const sums = {};
          cols.forEach((c, idx)=>{
            const def = colDefs[idx];
            if(def && def.bottomCalc === 'sum'){
              const key = 'c'+(idx-1);
              const vals = tab.getData().map(r => (r[key]||0));
              const s = vals.reduce((a,b)=>a + (Number(b)||0), 0);
              sums[key] = s;
            }
          });

          // build footer HTML to mimic DataTables scrollFoot tfoot
          const tbl = document.createElement('table');
          tbl.className = 'summary-table-footer';
          tbl.style.width = '100%';
          tbl.style.borderCollapse = 'collapse';
          const tr = document.createElement('tr');
          tr.setAttribute('data-totals','1');

          // Build sums mapped by field name (e.g., 'c0', 'c1', ...)
          const sumsByField = {};
          try{
            cols.forEach((c, idx)=>{
              try{
                const field = c.getField ? c.getField() : null;
                if(field){
                  const key = String(field);
                  const vals = tab.getData().map(r => (r[key]||0));
                  sumsByField[key] = vals.reduce((a,b)=>a + (Number(b)||0), 0);
                }
              }catch(_){ }
            });
          }catch(_){ }

          // Decide target field for ΣΥΝΟΛΑ: prefer explicit 'c6', else try detect date-like field
          let targetField = 'c6';
          if(!(targetField in sumsByField)){
            try{
              const defs = tab.getColumnDefinitions() || [];
              const titles = defs.map(d => (d.title||'').toString().toLowerCase());
              const dateCandidates = ['ημερομηνία','ημερομηνιa','ημερ','date','ημ.','ημ'];
              for(let k=0;k<titles.length;k++){
                for(const cand of dateCandidates){ if(titles[k].includes(cand)) { targetField = defs[k] && defs[k].field ? defs[k].field : targetField; break; } }
                if(targetField && targetField !== 'c6' && (targetField in sumsByField)) break;
              }
            }catch(_){ }
          }

          // Create footer cells matching the current visible column order
          const visibleCols = tab.getColumns() || [];
          for(let colIdx=0; colIdx<visibleCols.length; colIdx++){
            const colObj = visibleCols[colIdx];
            const f = colObj.getField ? colObj.getField() : null;
            const td = document.createElement('td');
            // Apply base styling to all footer cells
            td.style.color = '#1f2937';
            td.style.background = '#f8fafc';
            td.style.padding = '10px 8px';
            td.style.fontWeight = '600';
            td.style.fontSize = '14px';
            td.style.border = '1px solid #e2e8f0';

            if(f && String(f) === String(targetField)){
              // This is the ΣΥΝΟΛΑ cell
              td.textContent = 'ΣΥΝΟΛΑ';
              td.className = 'synola-cell';
              td.style.textAlign = 'left';
              td.style.paddingLeft = '8px';
              td.style.fontWeight = '700';
              td.style.color = '#0d6efd';
            } else if(f && (f in sumsByField)){
              // Numeric sum cell
              td.textContent = formatGreekNumberLocal(sumsByField[f]);
              td.style.textAlign = 'right';
            } else {
              // selection column or non-numeric column - leave blank
              td.textContent = '';
              td.style.textAlign = 'center';
            }
            tr.appendChild(td);
          }
          footer.innerHTML = '';
          footer.appendChild(tbl);
          tbl.appendChild(tr);

          // Force visibility in dark mode if data-theme is set
          try{
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if(isDark){
              footer.style.background = '#1f2937';
              footer.style.borderTop = '2px solid #3b82f6';
              Array.from(tbl.querySelectorAll('td')).forEach(td => {
                td.style.color = '#ffffff';
                td.style.background = '#1f2937';
                td.style.borderColor = 'rgba(255,255,255,0.1)';
                if(td.classList.contains('synola-cell')){
                  td.style.color = '#60a5fa';
                }
              });
            }
          }catch(_){ }
        }catch(err){ console.warn('renderFooter failed', err); }
      }

      // initial footer render and on data change
      renderFooter();

      // Wire up dynamic status text showing total/filtered/selected counts
      const statusSpan = document.getElementById('tabulatorStatus');
      function updateStatus(){
        try{
          if(!statusSpan) return;
          const total = (tab && typeof tab.getData === 'function') ? (tab.getData()||[]).length : 0;
          const visible = (tab && typeof tab.getDataCount === 'function') ? tab.getDataCount('active') : total;
          let selected = 0;
          try{ selected = (tab && typeof tab.getSelectedData === 'function') ? (tab.getSelectedData()||[]).length : 0; }catch(_){ selected = 0; }
          const q = (document.getElementById('globalSearch')||{}).value || '';
          let txt = '';
          if(selected && selected>0){
            txt = `Επιλεγμένες: ${selected} από ${total}`;
          } else if(q && q.trim() !== '' && visible !== total){
            txt = `Εμφανίζονται ${visible} από ${total} εγγραφές`;
          } else {
            txt = `Σύνολο εγγραφών: ${total}`;
          }
          statusSpan.textContent = txt;
          console.info('[Status]', txt);
        }catch(err){ console.warn('updateStatus failed', err); }
      }

      // Wire updates to Tabulator events
      try{ tab.on('dataLoaded', ()=>{ updateStatus(); renderFooter(); setTabulatorHeight(tab); }); }catch(_){ }
      try{ tab.on('dataFiltered', ()=>{ updateStatus(); renderFooter(); setTabulatorHeight(tab); }); }catch(_){ }
      try{ tab.on('dataChanged', ()=>{ updateStatus(); renderFooter(); setTabulatorHeight(tab); }); }catch(_){ }
      try{ tab.on('pageLoaded', ()=>{ updateStatus(); setTabulatorHeight(tab); }); }catch(_){ }
      try{ tab.on('rowSelectionChanged', ()=>{ updateStatus(); renderFooter(); setTabulatorHeight(tab); }); }catch(_){ }

      // Global search updates
      try{
        const searchInput = document.getElementById('globalSearch');
        if(searchInput){
          searchInput.addEventListener('input', function(){
            setTimeout(()=>{ updateStatus(); }, 100);
          });
        }
      }catch(_){ }

      // Initial status update
      setTimeout(()=>{ updateStatus(); }, 200);

      // localize and translate paginator controls to Greek
      function localizePaginator(){
        try{
          const pag = wrapper.querySelector('.tabulator-paginator');
          if(!pag) return;
          // Translate buttons by class
          const first = pag.querySelector('.tabulator-page-first'); if(first) first.textContent = 'Πρώτη';
          const prev  = pag.querySelector('.tabulator-page-previous'); if(prev) prev.textContent = 'Προηγ.';
          const next  = pag.querySelector('.tabulator-page-next'); if(next) next.textContent = 'Επόμενη';
          const last  = pag.querySelector('.tabulator-page-last'); if(last) last.textContent = 'Τελευταία';
          // page number buttons keep numeric labels
        }catch(_){ }
      }
      try{ localizePaginator(); }catch(_){ }
      // re-localize when pagination updates
      try{ tab.on && tab.on('dataLoaded', localizePaginator); tab.on && tab.on('pageLoaded', localizePaginator); }catch(_){ }
      // Watch for paginator DOM changes (Tabulator may re-render controls)
      try{
        const mo = new MutationObserver((m)=>{ localizePaginator(); });
        mo.observe(wrapper, { childList:true, subtree:true });
      }catch(_){ }
      tab.on('dataChanged', renderFooter);
      tab.on('rowSelectionChanged', function(data, rows){
        // Do NOT persist selection to localStorage to avoid stale selections
        // and accidental deletions after partial reloads. Only use live selection.
        try{ /* noop: intentionally not saving selection */ }catch(_){ }
        renderFooter();
      });

      // Persist column widths when user resizes columns
      try{
        tab.on('columnResized', function(column){
          try{
            const cols = tab.getColumns();
            const mapping = {};
            cols.forEach(c => {
              try{ const f = c.getField(); if(f) mapping[f] = c.getWidth(); }catch(_){ }
            });
            try{ localStorage.setItem('fbp_tab_col_widths', JSON.stringify(mapping)); }catch(_){ }
          }catch(_){ }
        });
      }catch(_){ }

      // Recompute height on window resize to keep viewport fit
      try{
        window.addEventListener('resize', function(){ setTabulatorHeight(tab); });
      }catch(_){ }

      // Wire page length selector (top control)
      try{
        const lenSel = document.getElementById('pageLengthSelect');
        if(lenSel){
          // set initial value
          lenSel.value = String(pageSize);
          lenSel.addEventListener('change', ()=>{
            const v = parseInt(lenSel.value, 10) || 10;
            try{ localStorage.setItem('fbp_tab_page_len', String(v)); }catch(_){ }
            try{ tab.setPageSize(v); }catch(_){ }
          });
        }
      }catch(_){ }

      // Do NOT auto-restore selection after reload/delete to avoid unintended selections
      // User will manually select items again if needed

      // wire global search to Tabulator filter (search across all fields)
      const globalSearch = document.getElementById('globalSearch');
      if(globalSearch){
        let searchTO = null;
        globalSearch.addEventListener('input', function(){ clearTimeout(searchTO); searchTO = setTimeout(()=>{
          const q = (globalSearch.value||'').toLowerCase();
          if(!q){ tab.clearFilter(true); return; }
          tab.setFilter(function(data, filterParams){
            return Object.keys(data).some(k=>{
              if(k.startsWith('c')){
                const v = data[k];
                if(v===null||v===undefined) return false;
                return String(v).toLowerCase().includes(q);
              }
              return false;
            });
          });
        }, 150); });
      }

      // expose tabulator instance for other code
      window.FBP_TABULATOR = tab;

      // Helper to collect selected marks from Tabulator
      window._fbp_collect_marks_from_tabulator = function(){
        try{
          if(window.FBP_TABULATOR){
            const sel = window.FBP_TABULATOR.getSelectedData();
            const marks = sel.map(r=> r._mark ).filter(v=>v);
            console.log(`[_fbp_collect_marks_from_tabulator] Selected marks count: ${marks.length}, marks:`, marks);
            return Array.isArray(marks) ? marks : [];
          }
        }catch(_){ }
        return [];
      };

    }catch(e){ console.debug('Tabulator migration failed', e); }
  };

  document.addEventListener('DOMContentLoaded', function(){
    try{ document.querySelectorAll('.dataTables_wrapper').forEach(el=>el.remove()); }catch(_){ }
    try{ window.FBP_INIT_TABULATOR(); }catch(_){ }
  });
})();
</script>
